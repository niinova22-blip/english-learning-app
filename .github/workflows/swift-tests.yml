name: Swift Tests

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: macos-latest
    env:
      # Redirect swift-transformers to a fork carrying a backported fix for
      # a missing OrderedCollections dependency declaration on its Hub
      # target (upstream PR huggingface/swift-transformers#299, merged in
      # 1.1.5 -- out of reach of mlx-swift-examples 2.29.1's own
      # `.upToNextMinor(from: "1.0.0")` constraint on swift-transformers).
      # See ci/swiftpm-mirrors.json and task-4-report.md.
      SWIFTPM_MIRROR_CONFIG: ${{ github.workspace }}/ci/swiftpm-mirrors.json
    defaults:
      run:
        working-directory: LearningEngine
    steps:
      - uses: actions/checkout@v4
      - name: Verify content assembly is up to date
        working-directory: ${{ github.workspace }}
        run: |
          python3 scripts/assemble-content.py
          git diff --exit-code -- \
            App/Sources/EnglishApp/Resources/YDSAcademicVocabulary1.json \
            LearningEngine/Tests/LearningEngineTests/Fixtures/YDSAcademicVocabulary1.json
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: swift test
        run: swift test --parallel
      - name: swift test (TutorEngine)
        working-directory: TutorEngine
        run: swift test --parallel
