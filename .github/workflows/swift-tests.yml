name: Swift Tests

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: LearningEngine
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: swift test
        run: swift test --parallel
