name: App Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      export_ipa:
        description: "Also build and upload an unsigned .ipa for AltStore sideloading"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project EnglishApp.xcodeproj \
            -scheme EnglishApp \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
      - name: Run unit tests
        run: |
          xcodebuild test \
            -project EnglishApp.xcodeproj \
            -scheme EnglishApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned .ipa for sideloading
        if: github.event_name == 'workflow_dispatch' && inputs.export_ipa
        run: |
          xcodebuild archive \
            -project EnglishApp.xcodeproj \
            -scheme EnglishApp \
            -archivePath build/EnglishApp.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p build/Payload
          cp -R build/EnglishApp.xcarchive/Products/Applications/EnglishApp.app build/Payload/
          cd build && zip -r EnglishApp.ipa Payload
      - name: Upload .ipa artifact
        if: github.event_name == 'workflow_dispatch' && inputs.export_ipa
        uses: actions/upload-artifact@v4
        with:
          name: EnglishApp-unsigned
          path: App/build/EnglishApp.ipa
