name: App Build

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v4
      - name: Cache tutor model
        uses: actions/cache@v4
        with:
          path: App/Sources/EnglishApp/Resources/TutorModel
          key: tutor-model-${{ hashFiles('scripts/fetch-tutor-model.sh') }}
      - name: Fetch tutor model
        working-directory: ${{ github.workspace }}
        run: bash scripts/fetch-tutor-model.sh
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project EnglishApp.xcodeproj \
            -scheme EnglishApp \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
      - name: Run unit tests
        run: |
          xcodebuild test \
            -project EnglishApp.xcodeproj \
            -scheme EnglishApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO
