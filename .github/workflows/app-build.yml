name: App Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      export_ipa:
        description: "Also build and upload an unsigned .ipa for AltStore sideloading"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project EnglishApp.xcodeproj \
            -scheme EnglishApp \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
