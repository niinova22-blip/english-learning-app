name: EnglishApp
options:
  bundleIdPrefix: com.niinova22.englishapp
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
packages:
  LearningEngine:
    path: ../LearningEngine
  TutorEngine:
    path: ../TutorEngine
targets:
  EnglishApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/EnglishApp
        excludes:
          - "Resources/TutorModel/**"
      - path: Sources/EnglishApp/Resources/TutorModel
        type: folder
    dependencies:
      - package: LearningEngine
      - package: TutorEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niinova22.englishapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Lexpath"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  EnglishAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/EnglishAppTests
    dependencies:
      - target: EnglishApp
      - package: LearningEngine
      - package: TutorEngine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
  EnglishAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: EnglishApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
        TEST_TARGET_NAME: EnglishApp
schemes:
  EnglishApp:
    build:
      targets:
        EnglishApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EnglishAppTests
    archive:
      config: Release
  Screenshots:
    build:
      targets:
        EnglishApp: all
    test:
      config: Debug
      targets:
        - EnglishAppUITests
